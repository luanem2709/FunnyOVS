<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Văn phòng 3D — AI Agents</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <!-- HUD: nút dừng khẩn cấp + chế độ tự động + thanh năng lượng token -->
      <div class="hud hud-top">
        <div class="hud-row">
          <button id="emergency" class="emergency" title="Dừng toàn bộ agent ngay lập tức">
            <span class="dot"></span> DỪNG KHẨN CẤP
          </button>
          <div class="levels" id="levels">
            <button data-level="ask">Chỉ hỏi</button>
            <button data-level="balanced" class="active">Cân bằng</button>
            <button data-level="autonomous">Tự chủ cao</button>
          </div>
        </div>
        <div class="hud-row">
        <div class="quality" id="quality-widget">
          <span class="q-label">Chất lượng</span>
          <button data-q="low">Thấp</button>
          <button data-q="medium">Vừa</button>
          <button data-q="high">Cao</button>
          <button data-q="auto" class="active" title="Tự động theo FPS">Tự động</button>
          <span class="q-fps" id="quality-fps">—</span>
        </div>
        <div class="view-bar" id="view-bar">
          <button id="btn-overview" title="Bay về góc nhìn toàn cảnh văn phòng">Toàn cảnh</button>
          <button id="btn-daynight" title="Chuyển giữa ban ngày và ban đêm">🌙 Đêm</button>
          <span class="q-fps" id="cam-hint">WASD để di chuyển</span>
        </div>
        <div class="budget" id="budget-widget"></div>
        </div>
      </div>

      <div class="hud hud-right">
        <button class="tab" data-panel="tasks">Tác vụ &amp; chi tiêu</button>
        <button class="tab" data-panel="activity">Nhật ký hoạt động</button>
        <button class="tab" data-panel="browser">Nhật ký duyệt web</button>
        <button class="tab" data-panel="library">Phòng Thư viện</button>
        <button class="tab" data-panel="permissions">Quyền truy cập</button>
        <button class="tab" data-panel="executor">Executor &amp; xem lại</button>
        <button class="tab" data-panel="proposals">Đề xuất thay đổi</button>
        <button class="tab" data-panel="settings">Cài đặt</button>
      </div>

      <!-- Điều hướng nhanh giữa 9 phòng ban -->
      <nav class="hud room-nav" id="room-nav"></nav>

      <aside id="panel" class="panel hidden">
        <header>
          <h2 id="panel-title"></h2>
          <button id="panel-close">✕</button>
        </header>
        <div id="panel-body"></div>
      </aside>

      <!-- Hộp thoại xin quyền xuất hiện ngay trong cảnh 3D -->
      <div id="perm-dialog" class="perm-dialog hidden"></div>

      <!-- Hộp thoại xin duyệt tác vụ tốn nhiều token -->
      <div id="approval-dialog" class="perm-dialog hidden"></div>

      <!-- GĐ 5: Overlay đèn báo khi Executor điều khiển chuột/bàn phím -->
      <div id="input-overlay" class="input-overlay hidden">
        <div class="io-box">
          <div class="io-spinner"></div>
          <div class="io-text" id="io-text">Đang thao tác…</div>
          <button id="io-abort" class="io-abort">✋ HỦY KHẨN CẤP</button>
        </div>
      </div>

      <div id="toast-host"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
